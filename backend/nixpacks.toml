# Railway construye este servicio con Nixpacks, que detecta Python
# solo a partir de requirements.txt — pero WeasyPrint (generador del
# PDF del informe) no es solo una librería de Python: necesita Pango,
# Cairo y gdk-pixbuf instalados como librerías del sistema operativo
# para poder maquetar y dibujar el PDF. Sin este archivo, el import de
# WeasyPrint fallaría en Railway aunque funcione en local (donde estas
# librerías ya están instaladas vía Homebrew).
[phases.setup]
aptPkgs = [
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libgdk-pixbuf2.0-0",
  "libffi-dev",
  "shared-mime-info",
  "fonts-liberation",
]
