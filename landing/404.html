<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, follow">
<title>Página no encontrada — Pipo</title>
<!-- Fuentes autohospedadas. Antes venían del CDN de Google Fonts, lo que
     metía un tercero sin `integrity` en la página (lo marcaba el propio
     escáner de Pipo) y mandaba la IP del visitante a Google. Ver fonts.css. -->
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --cream:#F5EFE6;
    --cream-deep:#EBE1D2;
    --brown:#B08968;
    --brown-dark:#6F4E37;
    --terracotta:#C97B5A;
    --amber:#D9A441;
    --ink:#3A2E24;
    --line:rgba(111,78,55,.16);
    --shadow:0 18px 50px -22px rgba(111,78,55,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Nunito',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
    overflow-x:hidden;
  }
  h1,.display{font-family:'Fraunces',serif;letter-spacing:-.02em;line-height:1.1}
  a{text-decoration:none}

  .escena{position:relative;width:280px;height:300px;margin-bottom:8px}
  /* 340px fijos se salían de la pantalla en móviles estrechos (medido a
     320px: 40px de scroll horizontal). Es decoración, puede encoger. */
  .halo{position:absolute;inset:0;margin:auto;width:min(340px,86vw);height:min(340px,86vw);border-radius:50%;background:radial-gradient(circle,rgba(201,123,90,.20),transparent 65%)}

  /* el búho entero se balancea, como si buscara algo que no encuentra */
  .pipo-confuso{width:220px;height:auto;position:relative;z-index:2;animation:busca 3.2s ease-in-out infinite}
  @keyframes busca{
    0%,100%{transform:rotate(0deg) translateX(0)}
    25%{transform:rotate(-9deg) translateX(-6px)}
    50%{transform:rotate(0deg) translateX(0)}
    75%{transform:rotate(9deg) translateX(6px)}
  }

  /* la lupa, dentro del propio dibujo, sigue con su animación normal */
  .mag{animation:sniff 4s ease-in-out infinite;transform-origin:center}
  @keyframes sniff{0%,100%{transform:rotate(0) translate(0,0)}50%{transform:rotate(-8deg) translate(-6px,4px)}}

  /* las pupilas se mueven de lado a lado dentro del ojo, sincronizadas
     con el balanceo de la cabeza: parece que busca algo sin encontrarlo */
  .ojos{animation:mirar 3.2s ease-in-out infinite;transform-origin:center}
  @keyframes mirar{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-9px)}
    50%{transform:translateX(0)}
    75%{transform:translateX(9px)}
  }

  /* varios interrogantes flotando alrededor de la cabeza, cada uno con
     su propio tamaño, posición, velocidad y desfase */
  .interrogante{
    position:absolute;
    font-family:'Fraunces',serif;
    font-weight:700;
    color:var(--terracotta);
    z-index:3;
    animation:flota 3s ease-in-out infinite;
  }
  .i1{top:2px;left:50%;font-size:44px;transform:translateX(-50%);animation-delay:0s}
  .i2{top:26px;left:14%;font-size:24px;color:var(--amber);opacity:.85;animation-delay:.6s;animation-duration:2.4s}
  .i3{top:34px;right:10%;font-size:30px;opacity:.9;animation-delay:1.1s;animation-duration:2.8s}
  .i4{top:-6px;right:26%;font-size:18px;color:var(--amber);opacity:.75;animation-delay:1.7s;animation-duration:2.1s}

  @keyframes flota{
    0%,100%{transform:translateY(0) rotate(-6deg);opacity:.8}
    25%{transform:translateY(-8px) rotate(-14deg);opacity:1}
    50%{transform:translateY(-12px) rotate(0deg);opacity:.85}
    75%{transform:translateY(-8px) rotate(14deg);opacity:1}
  }
  .i1{animation-name:flota1}
  @keyframes flota1{
    0%,100%{transform:translateX(-50%) translateY(0) rotate(-6deg);opacity:.85}
    25%{transform:translateX(-62%) translateY(-6px) rotate(-14deg);opacity:1}
    50%{transform:translateX(-50%) translateY(-10px) rotate(0deg);opacity:.85}
    75%{transform:translateX(-38%) translateY(-6px) rotate(14deg);opacity:1}
  }

  .codigo{font-family:'Fraunces';font-size:15px;font-weight:700;letter-spacing:.14em;color:var(--terracotta);margin-bottom:6px}
  h1{font-size:clamp(26px,4.5vw,36px);color:var(--brown-dark);margin-bottom:14px}
  p{font-size:16.5px;color:#6a5c4e;max-width:420px;margin:0 auto 30px}

  .btn{display:inline-flex;align-items:center;gap:8px;font-family:'Nunito';font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;cursor:pointer;border:none;background:var(--terracotta);color:#fff;box-shadow:0 10px 24px -10px var(--terracotta);transition:transform .15s ease, box-shadow .2s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px -12px var(--terracotta)}

  @media(prefers-reduced-motion:reduce){.pipo-confuso,.mag,.ojos,.interrogante{animation:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="pipo" viewBox="0 0 240 260">
      <ellipse cx="120" cy="150" rx="82" ry="90" fill="#B08968"/>
      <ellipse cx="120" cy="162" rx="58" ry="66" fill="#E8D6BF"/>
      <path d="M54 82 Q44 40 78 60 Q70 84 54 82Z" fill="#6F4E37"/>
      <path d="M186 82 Q196 40 162 60 Q170 84 186 82Z" fill="#6F4E37"/>
      <circle cx="92" cy="120" r="30" fill="#fff"/>
      <circle cx="148" cy="120" r="30" fill="#fff"/>
      <g class="ojos">
        <circle cx="95" cy="122" r="15" fill="#3A2E24"/>
        <circle cx="145" cy="122" r="15" fill="#3A2E24"/>
        <circle cx="100" cy="117" r="5" fill="#fff"/>
        <circle cx="150" cy="117" r="5" fill="#fff"/>
      </g>
      <path d="M70 92 Q92 80 116 92" stroke="#6F4E37" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M124 92 Q148 80 170 92" stroke="#6F4E37" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M120 132 L110 150 Q120 158 130 150Z" fill="#D9A441"/>
      <path d="M40 140 Q22 170 44 200 Q52 170 56 150Z" fill="#6F4E37"/>
      <path d="M200 140 Q218 170 196 200 Q188 170 184 150Z" fill="#6F4E37"/>
      <path d="M100 236 l0 14 M92 250 h16" stroke="#D9A441" stroke-width="5" stroke-linecap="round"/>
      <path d="M140 236 l0 14 M132 250 h16" stroke="#D9A441" stroke-width="5" stroke-linecap="round"/>
      <g class="mag">
        <circle cx="182" cy="196" r="26" fill="none" stroke="#C97B5A" stroke-width="7"/>
        <circle cx="182" cy="196" r="20" fill="rgba(201,123,90,.12)"/>
        <line x1="200" y1="214" x2="222" y2="238" stroke="#C97B5A" stroke-width="9" stroke-linecap="round"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="escena">
  <div class="halo"></div>
  <span class="interrogante i1">?</span>
  <span class="interrogante i2">?</span>
  <span class="interrogante i3">?</span>
  <span class="interrogante i4">?</span>
  <svg class="pipo-confuso"><use href="#pipo"/></svg>
</div>

<div class="codigo">ERROR 404</div>
<h1>Pipo no encuentra esta página</h1>
<p>Ha buscado por todo el nido y no hay manera. Puede que la URL esté mal escrita o que la página se haya movido.</p>
<a class="btn" href="index.html">← Volver al inicio</a>

</body>
</html>
