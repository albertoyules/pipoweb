<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<title>Pipo — Solicitudes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5EFE6;--cream-deep:#EBE1D2;--brown-dark:#6F4E37;--terracotta:#C97B5A;
    --sage:#8A9A5B;--amber:#D9A441;--brick:#B34733;--ink:#3A2E24;--line:rgba(111,78,55,.16);
    --shadow:0 18px 50px -22px rgba(111,78,55,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;padding:32px 20px 80px}
  h1{font-family:'Fraunces';font-weight:600;font-size:26px;margin-bottom:6px}
  .sub{color:var(--brown-dark);font-size:14px;margin-bottom:28px}
  .wrap{max-width:920px;margin:0 auto}
  .estado-carga,.estado-error{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;font-weight:700}
  .estado-error{color:var(--brick)}

  .pedido{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
  .pedido-cabecera{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .pedido .dominio{font-weight:800;font-size:16px}
  .badge{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .badge.pendiente{background:rgba(217,164,65,.18);color:#a9791d}
  .badge.pagado{background:rgba(138,154,91,.18);color:var(--sage)}
  .pedido .precio{margin-left:auto;font-family:'Fraunces';font-size:20px;font-weight:600}
  .pedido dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;color:var(--brown-dark);margin-top:12px}
  .pedido dt{font-weight:700}
  .pedido dd{word-break:break-word}
  .acciones-pedido{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{font-family:'Nunito';font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:999px;cursor:pointer;border:none;text-decoration:none;display:inline-flex;align-items:center}
  .btn-primary{background:var(--terracotta);color:#fff}
  .btn-ghost{background:var(--cream-deep);color:var(--brown-dark)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .zona-soluciones{margin-top:14px;background:var(--cream-deep);border-radius:12px;padding:14px 16px;font-size:13.5px;white-space:pre-wrap}
</style>
</head>
<body>

<div class="wrap">
  <h1>Solicitudes de arreglo</h1>
  <p class="sub">Panel privado — quién ha pedido que le arreglemos su web, y por dónde va cada caso. Aquí es donde se sacan las soluciones para hacer el trabajo. Enlace de solo uso personal, no lo compartas.</p>
  <div id="contenido"></div>
</div>

<script>
  const API_BASE = "https://pipo-analiza-production.up.railway.app";
  const clave = new URLSearchParams(window.location.search).get("clave") || "";
  const contenido = document.getElementById("contenido");

  function formatearFecha(fechaSql) {
    // fechaSql viene en UTC de SQLite ("YYYY-MM-DD HH:MM:SS")
    return new Date(fechaSql.replace(" ", "T") + "Z").toLocaleString("es-ES");
  }

  // Los siguientes pasos de una solicitud. El botón enseña siempre el
  // estado al que se puede pasar, no el actual.
  const SIGUIENTE_ESTADO = { nueva: "presupuestada", presupuestada: "hecha" };
  const ETIQUETA_ESTADO = { nueva: "Nueva", presupuestada: "Presupuestada", hecha: "Hecha" };
  const ACCION_ESTADO = { nueva: "Marcar presupuestada", presupuestada: "Marcar hecha" };

  function pintarSolicitud(solicitud) {
    const token = solicitud.token_escaneo || "";
    const enlaceInforme = `informe.html?id=${solicitud.id_escaneo}&t=${encodeURIComponent(token)}&dominio=${encodeURIComponent(solicitud.dominio)}`;
    const enlacePdf = `${API_BASE}/api/informe/${solicitud.id_escaneo}/pdf?t=${encodeURIComponent(token)}`;
    const siguiente = SIGUIENTE_ESTADO[solicitud.estado];

    const div = document.createElement("div");
    div.className = "pedido";
    div.innerHTML = `
      <div class="pedido-cabecera">
        <span class="dominio">${solicitud.dominio}</span>
        <span class="badge ${solicitud.estado === "hecha" ? "pagado" : "pendiente"}">${ETIQUETA_ESTADO[solicitud.estado] || solicitud.estado}</span>
        <span class="precio">~${solicitud.precio_estimado}€</span>
      </div>
      <dl>
        <dt>Email</dt><dd>${solicitud.email}</dd>
        <dt>Teléfono</dt><dd>${solicitud.telefono || "—"}</dd>
        <dt>Referencia</dt><dd>${solicitud.referencia}</dd>
        <dt>Recibida</dt><dd>${formatearFecha(solicitud.fecha)}</dd>
        <dt>Mensaje</dt><dd>${solicitud.mensaje || "—"}</dd>
        <dt>Ver informe</dt><dd><a href="${enlaceInforme}" target="_blank">${enlaceInforme}</a></dd>
      </dl>
      <div class="acciones-pedido">
        ${siguiente ? `<button class="btn btn-primary" data-estado="${siguiente}" data-id="${solicitud.id}">${ACCION_ESTADO[solicitud.estado]}</button>` : ""}
        <a class="btn btn-ghost" href="${enlacePdf}" target="_blank">Descargar PDF</a>
        <button class="btn btn-ghost" data-soluciones="${solicitud.id_escaneo}">Ver soluciones (interno)</button>
      </div>
      <div class="zona-soluciones" id="soluciones-${solicitud.id_escaneo}" style="display:none"></div>
    `;
    return div;
  }

  async function cargarSolicitudes() {
    contenido.innerHTML = `<div class="estado-carga">Cargando solicitudes...</div>`;
    try {
      const respuesta = await fetch(`${API_BASE}/api/solicitudes?clave=${encodeURIComponent(clave)}`);
      if (respuesta.status === 403) {
        contenido.innerHTML = `<div class="estado-error">Clave incorrecta. Revisa el enlace.</div>`;
        return;
      }
      if (!respuesta.ok) {
        contenido.innerHTML = `<div class="estado-error">No se han podido cargar las solicitudes.</div>`;
        return;
      }
      const solicitudes = await respuesta.json();
      if (solicitudes.length === 0) {
        contenido.innerHTML = `<div class="estado-carga">Todavía no hay ninguna solicitud.</div>`;
        return;
      }
      contenido.innerHTML = "";
      solicitudes.forEach((solicitud) => contenido.appendChild(pintarSolicitud(solicitud)));
    } catch (error) {
      contenido.innerHTML = `<div class="estado-error">No se ha podido conectar con el servidor.</div>`;
    }
  }

  contenido.addEventListener("click", async (evento) => {
    const botonEstado = evento.target.closest("[data-estado]");
    if (botonEstado) {
      botonEstado.disabled = true;
      try {
        const respuesta = await fetch(
          `${API_BASE}/api/solicitudes/${botonEstado.dataset.id}/estado?clave=${encodeURIComponent(clave)}&estado=${botonEstado.dataset.estado}`,
          { method: "POST" }
        );
        if (respuesta.ok) {
          cargarSolicitudes();
        } else {
          botonEstado.disabled = false;
        }
      } catch (error) {
        botonEstado.disabled = false;
      }
      return;
    }

    const botonSoluciones = evento.target.closest("[data-soluciones]");
    if (botonSoluciones) {
      const idEscaneo = botonSoluciones.dataset.soluciones;
      const zona = document.getElementById(`soluciones-${idEscaneo}`);
      if (zona.style.display === "block") {
        zona.style.display = "none";
        return;
      }
      zona.style.display = "block";
      zona.textContent = "Cargando...";
      try {
        // Las soluciones son herramienta interna: el backend las sirve
        // solo con la clave de admin, y no hay ningún botón en la web
        // pública que lleve aquí (ver CLAUDE.md, P2).
        const respuesta = await fetch(
          `${API_BASE}/api/informe/${idEscaneo}/soluciones?clave=${encodeURIComponent(clave)}`,
          { method: "POST" }
        );
        const datos = await respuesta.json();
        zona.textContent = JSON.stringify(datos, null, 2);
      } catch (error) {
        zona.textContent = "No se han podido cargar las soluciones.";
      }
    }
  });

  if (!clave) {
    contenido.innerHTML = `<div class="estado-error">Falta la clave en el enlace (?clave=...).</div>`;
  } else {
    cargarSolicitudes();
  }
</script>

</body>
</html>
